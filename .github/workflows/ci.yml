name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo. Any future step that
# needs to write (comments, SARIF upload, OIDC) must opt in at the job level.
permissions:
  contents: read

jobs:
  swift:
    name: Swift package checks
    runs-on: macos-15
    steps:
      - name: Check out repository
        # Pinned to a full commit SHA (supply-chain hardening); Dependabot keeps
        # the trailing tag comment in sync when it proposes an upgrade.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build package with strict concurrency and warnings as errors
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test package
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test package in release
        run: swift test -c release -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test package with Thread Sanitizer
        run: swift test --sanitize=thread -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      # swift build --triple + SDK 指定はツールチェーン間で挙動が揺れる
      # (Xcode 16.4: -Xswiftc -sdk が効かない / 26.5: SDKROOT export が
      # manifest コンパイルを壊す)ため、バージョン非依存の xcodebuild を使う。
      # 複数 product をまとめて検証する package scheme を使う。
      # scheme 名はパッケージ名由来で、checkout ディレクトリ名に依存しない。
      - name: Build for iOS 13 floor
        run: |
          xcodebuild build -quiet \
            -scheme swift-tasking-Package \
            -destination "generic/platform=iOS Simulator"

      - name: Build prototype with strict concurrency and warnings as errors
        working-directory: Examples/TaskingPrototype
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test prototype package
        working-directory: Examples/TaskingPrototype
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test prototype package in release
        working-directory: Examples/TaskingPrototype
        run: swift test -c release -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test prototype package with Thread Sanitizer
        working-directory: Examples/TaskingPrototype
        run: swift test --sanitize=thread -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
