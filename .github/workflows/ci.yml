name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repo. Any future step that
# needs to write (comments, SARIF upload, OIDC) must opt in at the job level.
permissions:
  contents: read

jobs:
  swift:
    name: Swift package checks
    runs-on: macos-15
    steps:
      - name: Check out repository
        # Pinned to a full commit SHA (supply-chain hardening); Dependabot keeps
        # the trailing tag comment in sync when it proposes an upgrade.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build package
        run: swift build

      - name: Test package
        run: swift test

      # swift build --triple + SDK 指定はツールチェーン間で挙動が揺れる
      # (Xcode 16.4: -Xswiftc -sdk が効かない / 26.5: SDKROOT export が
      # manifest コンパイルを壊す)ため、バージョン非依存の xcodebuild を使う。
      # scheme 名はパッケージ名由来で、checkout ディレクトリ名に依存しない。
      - name: Build for iOS 13 floor
        run: |
          xcodebuild build -quiet \
            -scheme swift-tasking \
            -destination "generic/platform=iOS Simulator"

      - name: Test prototype package
        working-directory: Examples/TaskingPrototype
        run: swift test

      - name: Test prototype package in release
        working-directory: Examples/TaskingPrototype
        run: swift test -c release

      - name: Test prototype package with Thread Sanitizer
        working-directory: Examples/TaskingPrototype
        run: swift test --sanitize=thread
