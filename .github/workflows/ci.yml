name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift package checks
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build package
        run: swift build

      - name: Build for iOS 13 floor
        run: |
          SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift build \
            --triple arm64-apple-ios13.0-simulator \
            -Xswiftc -sdk -Xswiftc "$SDKROOT"

      - name: Test package
        run: swift test

      - name: Test prototype package
        working-directory: Examples/TaskingPrototype
        run: swift test

      - name: Test prototype package in release
        working-directory: Examples/TaskingPrototype
        run: swift test -c release

      - name: Test prototype package with Thread Sanitizer
        working-directory: Examples/TaskingPrototype
        run: swift test --sanitize=thread
