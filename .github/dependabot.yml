# Dependabot で CI の GitHub Actions を更新し、セキュリティ修正を取り込む。
# SHA の固定値と末尾のバージョンコメントは一緒に更新する。
#
# Swift package に外部依存を追加する場合は `package-ecosystem: "swift"` も設定し、
# その依存を Dependabot の追跡対象に含める。
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
